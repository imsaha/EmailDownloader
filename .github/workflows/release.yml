name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained EXE
        run: |
          dotnet publish EmailDownloader.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:AssemblyName=emaildl `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o ./publish

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "emaildl ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            publish/emaildl.exe
            appsettings.sample.json
            install.ps1
