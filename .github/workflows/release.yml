name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish win-x64
        run: |
          dotnet publish EmailDownloader.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:AssemblyName=emaildl `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: emaildl-win-x64
          path: publish/emaildl.exe

  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish ${{ matrix.rid }}
        run: |
          dotnet publish EmailDownloader.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:AssemblyName=emaildl \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o ./publish/${{ matrix.rid }}
          mv ./publish/${{ matrix.rid }}/emaildl \
             ./publish/${{ matrix.rid }}/emaildl-${{ matrix.rid }}

      - uses: actions/upload-artifact@v4
        with:
          name: emaildl-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/emaildl-${{ matrix.rid }}

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "emaildl ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/emaildl-win-x64/emaildl.exe
            artifacts/emaildl-osx-arm64/emaildl-osx-arm64
            artifacts/emaildl-osx-x64/emaildl-osx-x64
            appsettings.sample.json
            install.ps1
            install.sh
